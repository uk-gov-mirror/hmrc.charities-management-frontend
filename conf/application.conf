include "frontend.conf"

appName = "charities-management-frontend"
contact-frontend.serviceId = "charities-claims"

play.http.router = prod.Routes

play.filters.enabled += play.filters.csp.CSPFilter

# Play Modules
play.modules.enabled += "config.Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"

play.filters.enabled += "uk.gov.hmrc.play.bootstrap.frontend.filters.AllowlistFilter"

play.filters.headers.contentTypeOptions = nosniff

play.filters.csp {

  directives {
    script-src = ${play.filters.csp.nonce.pattern} "'unsafe-inline' 'strict-dynamic' https: http:"
    object-src = 'none'
    base-uri = 'none'
    report-uri: ${csp-report-host}"/content-security-policy-reports/"${appName}
  }
}

play.http.errorHandler = "handlers.ErrorHandler"

csp-report-host: "http://localhost:8861"

microservice {
    services {
      auth {
        host = localhost
        port = 8500
      }

      charities-claims {
        protocol = http
        host     = localhost
        port     = 8031
        context-path = "/charities-claims"
      }

      rate-limited-allow-list {
        host = localhost
        port = 11308
      }
    }
}

http-verbs.retries.intervals = [1s, 2s]

play.i18n.langCookieHttpOnly: "true"

# Change this value to true to enable Welsh translations to be loaded from messages.cy, and to display the language toggle
features.welsh-language-support = true

# Replace play.i18n.langs with the commented out line below when your service has been fully translated into Welsh
# to enable Welsh translations for all content, including the standard headers and footers.
play.i18n.langs = ["en", "cy"]

# To integrate with tracking-consent-frontend, uncomment and update the
# gtm.container property below to be one of a, b, c, d, e, f or sdes
#tracking-consent-frontend {
#  gtm.container = "<INSERT YOUR GTM CONTAINER LETTER HERE>"
#}

urls {
    baseUrl = "http://localhost:8030"
    accountUrl = "https://local.tax.service.gov.uk/account"
    makeCharityRepaymentClaimUrl = "http://localhost:8030/charities-claims/make-a-charity-repayment-claim"
    makeCharityRepaymentClaimAgentUrl = "http://localhost:8030/charities-claims/repayment-claim-details"
    deleteAgentClaimUrl = "http://localhost:8030/charities-claims/delete-charity-repayment-claim"
    signOut = "http://localhost:9553/bas-gateway/sign-out-without-state"
    feedbackUrl = "http://localhost:9514/feedback/charities-tax-claim"
    login = "http://localhost:9949/auth-login-stub/gg-sign-in"
    loginContinue = "http://localhost:8033/charities-management"
    researchUrl = "https://survey.take-part-in-research.service.gov.uk/jfe/form/SV_74GjifgnGv6GsMC?Source=DASS-Replatform-Charities"
    homePageUrl = "http://localhost:8033/charities-management"
    giftAidOtherIncomeCommunityBuildingsUrl = "https://www.gov.uk/government/publications/gift-aid-schedule-spreadsheets-to-claim-back-tax-on-donations"
    hmrcRecognisedSoftware = "https://www.gov.uk/government/publications/charities-online-commercial-software-suppliers"
    hmrcServicesHomeUrl = "http://localhost:9020/home",
    legacyCharitiesServiceUrl = "https://localhost:9020/charities-legacy"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

accessibility-statement {
  service-path = "/charities-claims"
}

tracking-consent-frontend {
  gtm.container = "c"
}

session {
  timeoutSeconds = 901
}

play-frontend-hmrc {
    useRebrand = true
    forceServiceNavigation = true
}

bootstrap {
  filters {
    allowlist {
      redirectUrlWhenDenied = "https://gov.uk"
      ips = ["127.0.0.1"]
      excluded += "/healthcheck"
      enabled = false
    }
  }
}

debugOutboundRequests = true

splitter.trafficSplitEnabled = false
splitter.serviceName = charities
splitter.allowListName = beta
